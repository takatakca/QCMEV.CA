# Takatak MEV — local / Coolify stack. NO secret in this file: copy .env.example to .env (outside git)
# and fill it. The backend refuses to start when JWT_SECRET or PRIVATE_KEY_ENCRYPTION_KEY is missing or weak.
#
# The Food Hub integration API has no public port: Food Hub reaches it on the internal network
# (e.g. http://qcmev-backend:3001). Only the dashboard is published.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-qcmev}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  qcmev-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env # cp backend/.env.example .env (repo root, never committed)
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qcmev}
      PORT: '3001'
      MEV_ENVIRONMENT: ${MEV_ENVIRONMENT:-SIMULATOR}
    expose:
      - '3001'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - qcmev-backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - '3000:3000'

volumes:
  postgres-data:
