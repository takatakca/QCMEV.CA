version: '3.9'

services:
  # ─────────────────────────────────────────────────────────────
  # PostgreSQL database
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: takatak
      POSTGRES_PASSWORD: takatak_dev_password
      POSTGRES_DB: qcmev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takatak -d qcmev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # NestJS backend
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://takatak:takatak_dev_password@postgres:5432/qcmev
      JWT_SECRET: CHANGE-THIS-IN-PRODUCTION-USE-A-LONG-RANDOM-STRING
      PRIVATE_KEY_ENCRYPTION_KEY: CHANGE-THIS-32-CHAR-KEY-IN-PROD!!
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: production
      # Set to SIMULATOR to use the built-in simulator instead of real MEV-WEB
      MEV_ENVIRONMENT: SIMULATOR
      # The simulator is served by this same backend container
      SIMULATOR_URL: http://localhost:3001/api/mev-simulator
    ports:
      - "3001:3001"
    # Migrations run from the image CMD: `prisma migrate deploy && node dist/main`

  # ─────────────────────────────────────────────────────────────
  # Next.js frontend
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://backend:3001
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_INTERNAL_URL: http://backend:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres-data:
