name: CI

# No secret is used: the end-to-end job creates random throwaway secrets and placeholder identities.
on:
  push:
    branches-ignore: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  e2e-simulator:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npm ci --no-audit --no-fund
        working-directory: tools/local-run
      - run: node run-local.mjs --skip-unit
        working-directory: tools/local-run
        env:
          QCMEV_REPORT_OUT: ${{ runner.temp }}/qcmev-local-run.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qcmev-local-run
          path: ${{ runner.temp }}/qcmev-local-run.json
          if-no-files-found: ignore

  frontend-container:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg API_INTERNAL_URL=http://qcmev-backend:3001 -t qcmev-frontend:readiness frontend
      - run: python3 scripts/verify-frontend-container.py --report "${{ runner.temp }}/qcmev-frontend-container.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qcmev-frontend-container
          path: ${{ runner.temp }}/qcmev-frontend-container.json
          if-no-files-found: ignore

  backend-image:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qcmev-backend:ci backend
